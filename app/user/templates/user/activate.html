<!DOCTYPE html>

<html>

<head>

<title>
Activate ZeroNexus Account
</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body class="bg-dark text-light">


<div class="container mt-5">

<div class="card bg-black border-info p-4">


<h2 class="text-info">
Welcome to ZeroNexus
</h2>


<p>
Hello {{ user.username }},
</p>


<p>
Create your new password to activate your account.
</p>



<form method="POST">


<div class="mb-3">

<label>
New Password
</label>

<input 
type="password"
name="password"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Confirm Password
</label>


<input
type="password"
name="confirm_password"
class="form-control"
required>


</div>



<button class="btn btn-info">

Activate Account

</button>


</form>


</div>

</div>


</body>

</html>
