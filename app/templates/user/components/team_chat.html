<div class="card border-0 shadow dashboard-card mb-4 chat-card">

    <div class="card-header d-flex justify-content-between align-items-center">

        <div>

            <h5 class="mb-0">

                <i class="bi bi-chat-dots-fill text-info"></i>

                Team Collaboration

            </h5>

            <small class="text-success">

                ● 8 Members Online

            </small>

        </div>

        <button class="btn btn-sm btn-outline-info">

            <i class="bi bi-plus-lg"></i>

        </button>

    </div>

    <div class="card-body p-0">

        <!-- Search -->

        <div class="p-3 border-bottom">

            <input type="text"
                   class="form-control"
                   placeholder="Search conversations...">

        </div>

        <!-- Channels -->

        <div class="px-3 py-2">

            <small class="text-secondary">

                CHANNELS

            </small>

            <div class="list-group mt-2">

                <a href="#"
                   class="list-group-item list-group-item-action active">

                    # General

                </a>

                <a href="#"
                   class="list-group-item list-group-item-action">

                    # Development

                </a>

                <a href="#"
                   class="list-group-item list-group-item-action">

                    # Cybersecurity

                </a>

                <a href="#"
                   class="list-group-item list-group-item-action">

                    # AI Academy

                </a>

            </div>

        </div>

        <hr class="m-0">

        <!-- Messages -->

        <div class="chat-messages p-3">

            <div class="message mb-3">

                <strong>

                    Raven

                </strong>

                <small class="text-secondary float-end">

                    2 min ago

                </small>

                <div class="chat-bubble">

                    Anyone ready for tonight's HTB challenge?

                </div>

            </div>

            <div class="message text-end mb-3">

                <strong>

                    You

                </strong>

                <small class="text-secondary">

                    Just now

                </small>

                <div class="chat-bubble own-message">

                    Finishing authentication module first.

                </div>

            </div>

            <div class="message mb-3">

                <strong>

                    Nyx

                </strong>

                <small class="text-secondary float-end">

                    Just now

                </small>

                <div class="chat-bubble">

                    I'll prepare the documentation.

                </div>

            </div>

        </div>

        <!-- Typing -->

        <div class="px-3">

            <small class="text-info">

                Raven is typing...

            </small>

        </div>

        <!-- Message Box -->

        <div class="p-3 border-top">

            <div class="input-group">

                <button class="btn btn-outline-secondary">

                    😊

                </button>

                <button class="btn btn-outline-secondary">

                    📎

                </button>

                <input type="text"
                       class="form-control"
                       placeholder="Type a message...">

                <button class="btn btn-info">

                    <i class="bi bi-send-fill"></i>

                </button>

            </div>

        </div>

    </div>

</div>
