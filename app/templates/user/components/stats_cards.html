<!-- ========================================= -->
<!-- DASHBOARD STATISTICS -->
<!-- ========================================= -->

<div class="card border-0 shadow dashboard-card mb-4">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">

            <i class="bi bi-speedometer2 text-info"></i>

            Dashboard Statistics

        </h5>

        <span class="badge bg-info">

            Live

        </span>

    </div>

    <div class="card-body">

        <div class="row text-center">

            <!-- PROJECTS -->

            <div class="col-md-4 mb-4">

                <div class="stat-circle projects-circle">

                    <svg width="150"
                         height="150">

                        <circle class="bg-circle"
                                cx="75"
                                cy="75"
                                r="60"/>

                        <circle class="progress-circle project-progress"
                                cx="75"
                                cy="75"
                                r="60"/>

                    </svg>

                    <div class="circle-content">

                        <h2>

                            {{ user.projects|length }}

                        </h2>

                        <small>

                            Projects

                        </small>

                    </div>

                </div>

            </div>

            <!-- MEETINGS -->

            <div class="col-md-4 mb-4">

                <div class="stat-circle meetings-circle">

                    <svg width="150"
                         height="150">

                        <circle class="bg-circle"
                                cx="75"
                                cy="75"
                                r="60"/>

                        <circle class="progress-circle meeting-progress"
                                cx="75"
                                cy="75"
                                r="60"/>

                    </svg>

                    <div class="circle-content">

                        <h2>

                            {{ stats.meetings }}

                        </h2>

                        <small>

                            Meetings

                        </small>

                    </div>

                </div>

            </div>

            <!-- ANNOUNCEMENTS -->

            <div class="col-md-4 mb-4">

                <div class="stat-circle announcements-circle">

                    <svg width="150"
                         height="150">

                        <circle class="bg-circle"
                                cx="75"
                                cy="75"
                                r="60"/>

                        <circle class="progress-circle announcement-progress"
                                cx="75"
                                cy="75"
                                r="60"/>

                    </svg>

                    <div class="circle-content">

                        <h2>

                            {{ stats.announcements }}

                        </h2>

                        <small>

                            Announcements

                        </small>

                    </div>

                </div>

            </div>

        </div>

        <hr class="my-4">

        <!-- QUICK INSIGHTS -->

        <div class="row text-center">

            <div class="col-md-3">

                <h4 class="text-info">

                    89%

                </h4>

                <small class="text-secondary">

                    Productivity

                </small>

            </div>

            <div class="col-md-3">

                <h4 class="text-success">

                    16

                </h4>

                <small class="text-secondary">

                    Tasks Completed

                </small>

            </div>

            <div class="col-md-3">

                <h4 class="text-warning">

                    8

                </h4>

                <small class="text-secondary">

                    Team Members

                </small>

            </div>

            <div class="col-md-3">

                <h4 class="text-danger">

                    4

                </h4>

                <small class="text-secondary">

                    Active Projects

                </small>

            </div>

        </div>

    </div>

</div>
