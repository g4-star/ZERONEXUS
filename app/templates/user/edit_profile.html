{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-dark text-white">
                    <h3 class="mb-0">
                        <i class="fas fa-user-edit"></i>
                        Edit Profile
                    </h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <h5 class="mb-3">
                            Personal Information
                        </h5>

                        <div class="mb-3">
                            <label class="form-label">Bio</label>
                            <textarea
                                name="bio"
                                class="form-control"
                                rows="4">{{ user.bio or "" }}</textarea>
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    value="{{ user.phone or '' }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location</label>
                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    value="{{ user.location or '' }}">
                            </div>

                        </div>

                        <hr>

                        <h5 class="mb-3">
                            Professional Information
                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Job Title
                                </label>

                                <input
                                    type="text"
                                    name="job_title"
                                    class="form-control"
                                    value="{{ user.job_title or '' }}">
                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Company
                                </label>

                                <input
                                    type="text"
                                    name="company"
                                    class="form-control"
                                    value="{{ user.company or '' }}">

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Skills
                            </label>

                            <textarea
                                name="skills"
                                rows="3"
                                class="form-control">{{ user.skills or "" }}</textarea>

                        </div>

                        <hr>

                        <h5 class="mb-3">
                            Social Links
                        </h5>

                        <div class="mb-3">
                            <label>Portfolio Website</label>

                            <input
                                type="url"
                                name="portfolio"
                                class="form-control"
                                value="{{ user.portfolio or '' }}">
                        </div>

                        <div class="mb-3">
                            <label>GitHub</label>

                            <input
                                type="url"
                                name="github"
                                class="form-control"
                                value="{{ user.github or '' }}">
                        </div>

                        <div class="mb-3">
                            <label>LinkedIn</label>

                            <input
                                type="url"
                                name="linkedin"
                                class="form-control"
                                value="{{ user.linkedin or '' }}">
                        </div>

                        <div class="mb-3">
                            <label>X / Twitter</label>

                            <input
                                type="url"
                                name="twitter"
                                class="form-control"
                                value="{{ user.twitter or '' }}">
                        </div>

                        <hr>

                        <h5 class="mb-3">
                            Cybersecurity Profiles
                        </h5>

                        <div class="mb-3">

                            <label>TryHackMe</label>

                            <input
                                type="url"
                                name="tryhackme"
                                class="form-control"
                                value="{{ user.tryhackme or '' }}">

                        </div>

                        <div class="mb-3">

                            <label>Hack The Box</label>

                            <input
                                type="url"
                                name="hackthebox"
                                class="form-control"
                                value="{{ user.hackthebox or '' }}">

                        </div>

                        <div class="mb-4">

                            <label>CTFtime</label>

                            <input
                                type="url"
                                name="ctftime"
                                class="form-control"
                                value="{{ user.ctftime or '' }}">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('user.profile') }}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                            <button
                                class="btn btn-primary"
                                type="submit">

                                <i class="fas fa-save"></i>

                                Save Profile

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
