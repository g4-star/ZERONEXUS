{% extends 'admin/layout.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="page-title mb-0">
        Manage Teams
    </h1>

    <a href="{{ url_for('admin.create_team') }}"
       class="btn btn-info">
        ➕ Add Team
    </a>

</div>


<div class="panel-card">

    <div class="table-responsive">

        <table class="table table-dark align-middle">

            <thead>

                <tr>

                    <th>Lead</th>

                    <th>Team</th>

                    <th>Team Lead</th>

                    <th>Members</th>

                    <th class="text-end">
                        Actions
                    </th>

                </tr>

            </thead>

            <tbody>

                {% for team in teams %}

                <tr>

                    <td>

                        <img
                            src="{{ url_for('static', filename=team.lead_image) }}"
                            class="table-avatar"
                            alt="{{ team.name }}"
                        >

                    </td>

                    <td>

                        <strong>{{ team.name }}</strong>

                    </td>

                    <td>

                        {{ team.lead_name or "Not Assigned" }}

                    </td>

                    <td>

                        {{ team.users|length }}

                    </td>

                    <td class="text-end">

                        <!-- View Workspace -->

                        <a
                            href="{{ url_for('admin.open_team', team_id=team.id) }}"
                            class="btn btn-sm btn-success"
                        >
                            👁 View
                        </a>

                        <!-- Edit -->

                        <a
                            href="{{ url_for('admin.edit_team', team_id=team.id) }}"
                            class="btn btn-sm btn-outline-info"
                        >
                            ✏ Edit
                        </a>

                        <!-- Delete -->

                        <a
                            href="#"
                            class="btn btn-sm btn-outline-danger disabled"
                        >
                            🗑 Delete
                        </a>

                    </td>

                </tr>

                {% else %}

                <tr>

                    <td colspan="5" class="text-center text-muted py-4">

                        No teams found.

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
