{% extends 'admin/layout.html' %}

{% block content %}

<div class='d-flex justify-content-between align-items-center mb-4'>
    <h1 class='page-title mb-0'>Manage Teams</h1>
    <a href='#' class='btn btn-info'>➕ Add Team</a>
</div>

<div class='panel-card'>

    <div class='table-responsive'>

        <table class='table table-dark align-middle'>

            <thead>
                <tr>
                    <th>Lead</th>
                    <th>Team</th>
                    <th>Lead Name</th>
                    <th>Members</th>
                    <th class='text-end'>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for team in teams %}
                <tr>
                    <td>
                        <img src='{{ url_for("static", filename=team.lead_image) }}'
                             class='table-avatar' alt=''>
                    </td>
                    <td>{{ team.name }}</td>
                    <td>{{ team.lead_name }}</td>
                    <td>{{ team.members|length }}</td>
                    <td class='text-end'>
                        <a href='{{ url_for("admin.edit_team", team_id=team.id) }}'
                           class='btn btn-sm btn-outline-info'>Edit</a>
                        <a href='#' class='btn btn-sm btn-outline-danger'>Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

{% endblock %}
