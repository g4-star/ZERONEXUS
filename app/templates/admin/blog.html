<a href="{{ url_for('admin.add_blog_post') }}"
   class="btn btn-info">
    ➕ New Post
</a>
<div class="table-responsive">

    <table class="table table-dark table-hover align-middle mb-0" data-searchable>

        <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for post in posts %}
            <tr>
                <td>{{ post.title }}</td>

                <td>
                    {% if post.is_published %}
                    <span class="badge bg-success">Published</span>
                    {% else %}
                    <span class="badge bg-secondary">Draft</span>
                    {% endif %}
                </td>

                <td>{{ post.created_at.strftime('%Y-%m-%d') }}</td>

                <td>
                    <a href="{{ url_for('admin.edit_blog_post', post_id=post.id) }}"
                       class="btn btn-sm btn-outline-info">Edit</a>

                    <a href="{{ url_for('admin.delete_blog_post', post_id=post.id) }}"
                       class="btn btn-sm btn-outline-danger"
                       data-confirm="Delete this post?">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center text-muted py-4">
                    No blog posts yet.
                </td>
            </tr>
            {% endfor %}

        </tbody>

    </table>

</div>
