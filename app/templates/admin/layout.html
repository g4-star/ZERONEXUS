<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>ZeroNexus Admin</title>

    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='{{ url_for("static", filename="css/admin.css") }}'>
</head>
<body>

<div class='admin-wrapper'>

    <!-- Sidebar -->
    <aside class='sidebar'>
        <div class='sidebar-brand'>
            <h3>ZeroNexus</h3>
            <small>Admin Panel</small>
        </div>
        
        <nav class='sidebar-nav'>
            <a href='{{ url_for("admin.dashboard") }}'>🏠 Dashboard</a>
            <a href='{{ url_for("admin.manage_teams") }}'>🛡 Teams</a>
            <a href='{{ url_for("admin.manage_members") }}'>👥 Members</a>
            <a href='{{ url_for("admin.manage_projects") }}'>📁 Projects</a>
            <a href='{{ url_for("admin.manage_blog") }}'>📝 Blog</a>
            <a href='{{ url_for("admin.settings") }}'>⚙ Settings</a>
            <a href='{{ url_for("admin.logout") }}'>🚪 Logout</a>
        </nav>
        
    </aside>

    <!-- Main -->
    <main class='main-content'>

        <header class='topbar'>
            <div>
                <h4 class='mb-0'>Welcome, {{ current_user.username }}</h4>
            </div>
        </header>

        <div class='content-area'>
            {% block content %}{% endblock %}
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
