<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroNexus — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;
  background:#06090f;color:#e8ecf4;
  background-image:
    radial-gradient(700px 400px at 20% 0%, rgba(139,92,246,.16), transparent 60%),
    radial-gradient(700px 400px at 80% 100%, rgba(59,130,246,.12), transparent 60%);
}
.card{
  width:min(400px,92vw);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:36px 32px;backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.45);
}
.logo{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:28px}
.logo-icon{
  width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  display:grid;place-items:center;font-size:19px;color:#fff;box-shadow:0 0 24px rgba(139,92,246,.35);
}
.logo-text h1{font-size:16px;font-weight:800;letter-spacing:.4px}
.logo-text span{font-size:9.5px;font-weight:700;letter-spacing:2.6px;color:#a78bfa}
h2{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px}
.sub{font-size:12.5px;color:#8a92a6;text-align:center;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:#8a92a6;margin:14px 0 6px;text-transform:uppercase}
input{
  width:100%;padding:12px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:#e8ecf4;font-size:13.5px;outline:none;transition:.2s;
}
input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.18)}
button{
  width:100%;margin-top:22px;padding:13px;border:none;border-radius:11px;cursor:pointer;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:14px;font-weight:700;
  box-shadow:0 6px 18px rgba(139,92,246,.4);transition:.2s;
}
button:hover{transform:translateY(-2px)}
.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#f87171;font-size:12.5px;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.switch{text-align:center;margin-top:18px;font-size:12.5px;color:#8a92a6}
.switch a{color:#a78bfa;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🛡</div>
    <div class="logo-text"><h1>ZeroNexus</h1><span>TEAM LEAD</span></div>
  </div>
  <h2>{{ 'Create account' if register else 'Welcome back' }}</h2>
  <p class="sub">{{ 'Join the team workspace.' if register else 'Sign in to your dashboard.' }}</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="POST" action="{{ url_for('auth.register' if register else 'auth.login') }}">
    <label>Username</label>
    <input type="text" name="username" required autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit">{{ 'Sign up' if register else 'Sign in' }}</button>
  </form>

  <div class="switch">
    {% if register %}
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    {% else %}
      New here? <a href="{{ url_for('auth.register') }}">Create account</a>
    {% endif %}
  </div>
</div>
</body>
</html>
