<div class="widget">

    <div class="widget-title">

        <h5>

            <i class="bi bi-megaphone-fill text-warning"></i>

            Announcements

        </h5>

        <a href="{{ url_for('team.announcements') }}">
            View All
        </a>

    </div>

    {% if announcements %}

        {% for announcement in announcements[:4] %}

        <div class="announcement-card">

            <div class="announcement-icon">

                <i class="bi bi-pin-angle-fill"></i>

            </div>

            <div class="announcement-content">

                <strong>

                    {{ announcement.title }}

                </strong>

                <p>

                    {{ announcement.content[:100] }}...

                </p>

                <small>

                    {{ announcement.created_at.strftime("%d %b %Y") }}

                </small>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty-widget">

            No announcements available.

        </div>

    {% endif %}

</div>
