<aside class="chat-panel">

    <div class="chat-header">

        <h5>

            <i class="bi bi-chat-left-text-fill"></i>

            Team Chat

        </h5>

    </div>

    <div class="chat-search">

        <i class="bi bi-search"></i>

        <input
            type="text"
            placeholder="Search chats...">

    </div>

    <div class="chat-section">

        <small class="chat-label">
            CHANNELS
        </small>

        <a href="#" class="chat-item active">

            <div class="chat-avatar bg-primary">
                #
            </div>

            <div>

                <strong>general</strong>

                <small>Team discussions</small>

            </div>

        </a>

        <a href="#" class="chat-item">

            <div class="chat-avatar bg-success">
                #
            </div>

            <div>

                <strong>projects</strong>

                <small>Project updates</small>

            </div>

        </a>

        <a href="#" class="chat-item">

            <div class="chat-avatar bg-warning">
                #
            </div>

            <div>

                <strong>announcements</strong>

                <small>Important news</small>

            </div>

        </a>

    </div>

    <div class="chat-section">

        <small class="chat-label">
            ONLINE MEMBERS
        </small>

        {% for member in recent_members[:5] %}

        <div class="chat-item">

            <div class="avatar-wrapper">

                <img src="https://ui-avatars.com/api/?name={{ member.username }}&background=0D8ABC&color=fff"
                     class="member-avatar">

                <span class="online-dot"></span>

            </div>

            <div>

                <strong>{{ member.username }}</strong>

                <small>{{ member.role.replace("_"," ").title() }}</small>

            </div>

        </div>

        {% endfor %}

    </div>

</aside>
