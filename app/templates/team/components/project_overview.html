<div class="widget">

    <div class="widget-title">

        <h5>

            Active Projects

        </h5>

        <a href="{{ url_for('team.projects') }}">

            View All

        </a>

    </div>

    {% for project in projects[:5] %}

    <div class="project-row">

        <div>

            <strong>

                {{ project.title }}

            </strong>

            <small>

                {{ project.description[:60] if project.description else "No description" }}

            </small>

        </div>

        <span class="project-status">

            Active

        </span>

    </div>

    {% endfor %}

</div>
