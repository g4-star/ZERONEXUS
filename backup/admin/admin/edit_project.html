{% extends 'admin/layout.html' %}

{% block content %}

<h1 class='page-title mb-4'>Project Form</h1>

<div class='panel-card'>

    <form method='POST'>

        <div class='mb-3'>
            <label class='form-label'>Project Title</label>
            <input type='text' name='title' class='form-control'
                   value='{{ project.title if project else "" }}' required>
        </div>

        <div class='mb-3'>
            <label class='form-label'>Team</label>
            <select name='team_id' class='form-select' required>
                {% for team in teams %}
                <option value='{{ team.id }}'
                    {% if project and project.team_id == team.id %}selected{% endif %}>
                    {{ team.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class='mb-3'>
            <label class='form-label'>GitHub URL</label>
            <input type='url' name='github_url' class='form-control'
                   value='{{ project.github_url if project else "" }}'>
        </div>

        <div class='mb-3'>
            <label class='form-label'>Live Demo URL</label>
            <input type='url' name='live_url' class='form-control'
                   value='{{ project.live_url if project else "" }}'>
        </div>

        <div class='mb-3'>
            <label class='form-label'>Description</label>
            <textarea name='description' rows='5'
                      class='form-control'>{{ project.description if project else "" }}</textarea>
        </div>

        <button type='submit' class='btn btn-info'>Save Project</button>

    </form>

</div>

{% endblock %}
